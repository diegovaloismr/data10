<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- rede de pontos (mapa de talentos) -->
  <g stroke="#7686a8" stroke-opacity="0.35" stroke-width="2">
    <line x1="330" y1="300" x2="560" y2="420"/>
    <line x1="560" y1="420" x2="480" y2="620"/>
    <line x1="560" y1="420" x2="800" y2="360"/>
    <line x1="800" y1="360" x2="1040" y2="460"/>
    <line x1="800" y1="360" x2="960" y2="220"/>
    <line x1="1040" y1="460" x2="1260" y2="380"/>
    <line x1="1040" y1="460" x2="1180" y2="620"/>
    <line x1="480" y1="620" x2="760" y2="680"/>
    <line x1="760" y1="680" x2="1000" y2="640"/>
  </g>

  <g stroke="#e57426" stroke-opacity="0.55" stroke-width="3">
    <line x1="800" y1="360" x2="1040" y2="460"/>
  </g>

  <!-- nós -->
  <g>
    <circle cx="330" cy="300" r="10" fill="#3d517d"/>
    <circle cx="560" cy="420" r="12" fill="#3d517d"/>
    <circle cx="480" cy="620" r="10" fill="#3d517d"/>
    <circle cx="960" cy="220" r="10" fill="#3d517d"/>
    <circle cx="1260" cy="380" r="10" fill="#3d517d"/>
    <circle cx="1180" cy="620" r="10" fill="#3d517d"/>
    <circle cx="760" cy="680" r="10" fill="#3d517d"/>
    <circle cx="1000" cy="640" r="10" fill="#3d517d"/>
    <circle cx="800" cy="360" r="16" fill="#7686a8"/>
    <circle cx="1040" cy="460" r="22" fill="#e57426"/>
    <circle cx="1040" cy="460" r="9" fill="#f4f6fa"/>
  </g>

  <line x1="0" y1="820" x2="1600" y2="820" stroke="#e6eaf3" stroke-opacity="0.08" stroke-width="2"/>
</svg>
