<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- área do goleiro, à esquerda -->
  <g stroke="#e6eaf3" stroke-opacity="0.18" stroke-width="4" fill="none">
    <rect x="120" y="280" width="220" height="340"/>
    <rect x="120" y="370" width="90" height="160"/>
  </g>
  <rect x="106" y="400" width="14" height="100" fill="#f4f6fa" opacity="0.7"/>

  <circle cx="230" cy="450" r="20" fill="#e57426"/>

  <!-- três linhas de distribuição: curta, média, longa -->
  <path d="M 230 450 C 320 430, 380 420, 460 410" fill="none" stroke="#7686a8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="460" cy="410" r="12" fill="#7686a8"/>

  <path d="M 230 450 C 450 380, 650 340, 860 330" fill="none" stroke="#e57426" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <circle cx="860" cy="330" r="12" fill="#e57426"/>

  <path d="M 230 450 C 550 280, 950 200, 1360 220" fill="none" stroke="#f4f6fa" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 16" opacity="0.8"/>
  <circle cx="1360" cy="220" r="12" fill="#f4f6fa" opacity="0.9"/>

  <!-- zagueiros recebendo a saída curta -->
  <g fill="#7686a8" fill-opacity="0.7">
    <circle cx="520" cy="560" r="16"/>
    <circle cx="480" cy="700" r="16"/>
  </g>

  <line x1="0" y1="800" x2="1600" y2="800" stroke="#e6eaf3" stroke-opacity="0.08" stroke-width="2"/>
</svg>
