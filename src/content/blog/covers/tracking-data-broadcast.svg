<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- antena/sinal de transmissão à esquerda -->
  <g stroke="#e57426" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 300 340 Q 340 300 380 340"/>
    <path d="M 280 360 Q 340 280 400 360"/>
    <path d="M 260 380 Q 340 260 420 380"/>
  </g>
  <circle cx="340" cy="340" r="10" fill="#e57426"/>
  <line x1="340" y1="350" x2="340" y2="420" stroke="#e57426" stroke-width="4"/>

  <!-- ondas de transmissão indo para pequenos "clubes" à direita -->
  <path d="M 420 360 C 600 300, 800 300, 980 360" fill="none" stroke="#7686a8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M 420 380 C 620 460, 820 460, 1020 400" fill="none" stroke="#7686a8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M 420 400 C 600 560, 840 600, 1060 480" fill="none" stroke="#7686a8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- pontos de rastreamento (jogadores) sobre um pequeno campo à direita -->
  <rect x="1000" y="500" width="280" height="180" rx="8" fill="none" stroke="#e6eaf3" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="1140" y1="500" x2="1140" y2="680" stroke="#e6eaf3" stroke-opacity="0.25" stroke-width="2"/>
  <g fill="#e57426">
    <circle cx="1050" cy="540" r="7"/>
    <circle cx="1090" cy="600" r="7"/>
    <circle cx="1060" cy="650" r="7"/>
    <circle cx="1190" cy="560" r="7"/>
    <circle cx="1230" cy="620" r="7"/>
    <circle cx="1200" cy="660" r="7"/>
  </g>
</svg>
