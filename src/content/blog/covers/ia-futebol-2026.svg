<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- torre / observatório: camadas empilhadas de nós conectados -->
  <g stroke="#7686a8" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M 700 700 L 900 700 L 860 600 L 740 600 Z"/>
    <path d="M 740 600 L 860 600 L 830 500 L 770 500 Z"/>
    <path d="M 770 500 L 830 500 L 810 400 L 790 400 Z"/>
    <path d="M 790 400 L 810 400 L 800 300 Z"/>
  </g>

  <!-- nós conectados ao redor, representando rede de dados/IA -->
  <g stroke="#e57426" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M 800 300 L 500 220"/>
    <path d="M 800 300 L 1100 240"/>
    <path d="M 790 400 L 420 420"/>
    <path d="M 810 400 L 1180 440"/>
    <path d="M 770 500 L 480 600"/>
    <path d="M 830 500 L 1140 620"/>
  </g>

  <g fill="#f4f6fa">
    <circle cx="800" cy="300" r="10"/>
    <circle cx="500" cy="220" r="8"/>
    <circle cx="1100" cy="240" r="8"/>
    <circle cx="420" cy="420" r="8"/>
    <circle cx="1180" cy="440" r="8"/>
    <circle cx="480" cy="600" r="8"/>
    <circle cx="1140" cy="620" r="8"/>
  </g>
  <circle cx="800" cy="300" r="16" fill="#e57426"/>

  <line x1="200" y1="800" x2="1400" y2="800" stroke="#e6eaf3" stroke-opacity="0.08" stroke-width="2"/>
</svg>
