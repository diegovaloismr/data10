<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- linhas de campo sutis -->
  <g stroke="#e6eaf3" stroke-opacity="0.07" stroke-width="2">
    <rect x="140" y="140" width="1320" height="620" fill="none"/>
    <line x1="800" y1="140" x2="800" y2="760"/>
    <circle cx="800" cy="450" r="120" fill="none"/>
  </g>

  <!-- trajetórias de rastreamento (movimento de jogadores) -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.5" stroke-width="2">
    <path d="M 260 620 C 380 560, 420 500, 520 470 C 640 430, 700 380, 780 330"/>
    <path d="M 420 720 C 520 660, 600 600, 660 520 C 720 440, 820 420, 940 380"/>
    <path d="M 1240 240 C 1120 280, 1060 340, 1000 400 C 940 460, 860 480, 760 500"/>
    <path d="M 1340 620 C 1200 600, 1100 560, 1020 500 C 940 440, 880 420, 800 400"/>
  </g>

  <!-- destaque: um jogador rastreado quadro a quadro -->
  <path d="M 300 700 C 420 640, 500 560, 580 480 C 680 400, 820 360, 980 300" fill="none" stroke="#e57426" stroke-width="3.5" stroke-dasharray="1 16" stroke-linecap="round"/>

  <!-- pontos de captura (posições em instantes discretos) -->
  <g fill="#f4f6fa">
    <circle cx="300" cy="700" r="7"/>
    <circle cx="410" cy="630" r="7"/>
    <circle cx="520" cy="540" r="7"/>
    <circle cx="640" cy="450" r="7"/>
    <circle cx="780" cy="380" r="7"/>
    <circle cx="980" cy="300" r="10" fill="#e57426"/>
  </g>

  <circle cx="800" cy="450" r="6" fill="#d1590f" opacity="0.8"/>
</svg>
