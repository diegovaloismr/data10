<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="24%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2">
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
  </g>

  <!-- caminhos possíveis (ramificações de incerteza) -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.35" stroke-width="2.5">
    <path d="M 260 560 C 560 560, 700 560, 800 450 C 950 300, 1150 260, 1360 220"/>
    <path d="M 260 560 C 560 560, 700 560, 800 450 C 950 560, 1150 650, 1360 560"/>
    <path d="M 260 560 C 560 560, 700 560, 800 450 C 950 620, 1150 700, 1360 740"/>
  </g>

  <!-- curva principal em destaque -->
  <path d="M 260 560 C 560 560, 700 560, 800 450 C 950 300, 1150 260, 1360 220" fill="none" stroke="#e57426" stroke-width="5" stroke-linecap="round"/>

  <circle cx="800" cy="450" r="14" fill="#f4f6fa"/>
  <circle cx="1360" cy="220" r="12" fill="#e57426"/>

  <line x1="0" y1="820" x2="1600" y2="820" stroke="#e6eaf3" stroke-opacity="0.08" stroke-width="2"/>
</svg>
