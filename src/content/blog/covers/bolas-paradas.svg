<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- quadrante do escanteio: linha de fundo e linha lateral -->
  <g stroke="#e6eaf3" stroke-opacity="0.18" stroke-width="4">
    <line x1="1360" y1="120" x2="1360" y2="780"/>
    <line x1="1360" y1="780" x2="700" y2="780"/>
  </g>
  <!-- arco do escanteio -->
  <path d="M 1360 750 A 30 30 0 0 0 1330 780" fill="none" stroke="#e6eaf3" stroke-opacity="0.35" stroke-width="4"/>

  <!-- trajetória do cruzamento -->
  <path d="M 1345 765 C 1100 680, 850 520, 620 400" fill="none" stroke="#f4f6fa" stroke-width="5" stroke-dasharray="3 16" stroke-linecap="round" opacity="0.85"/>
  <circle cx="1345" cy="765" r="12" fill="#7686a8"/>

  <!-- área com jogadores se movimentando (pontos convergindo para o primeiro pau) -->
  <g fill="#e57426">
    <circle cx="620" cy="400" r="18"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.6">
    <circle cx="520" cy="460" r="14"/>
    <circle cx="560" cy="560" r="14"/>
    <circle cx="700" cy="480" r="14"/>
    <circle cx="740" cy="600" r="14"/>
    <circle cx="460" cy="360" r="14"/>
  </g>

  <!-- trave/gol à esquerda -->
  <rect x="180" y="330" width="14" height="180" fill="#f4f6fa" opacity="0.7"/>
</svg>
