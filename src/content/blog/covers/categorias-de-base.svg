<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- linha do chão -->
  <line x1="200" y1="740" x2="1400" y2="740" stroke="#e6eaf3" stroke-opacity="0.12" stroke-width="2"/>

  <!-- silhuetas de jogadores em alturas diferentes, agrupadas por "faixa" de maturação (bio-banding) -->
  <g fill="#7686a8" fill-opacity="0.5">
    <circle cx="320" cy="560" r="26"/>
    <rect x="296" y="588" width="48" height="150" rx="18"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.5">
    <circle cx="440" cy="520" r="30"/>
    <rect x="410" y="552" width="56" height="188" rx="20"/>
  </g>

  <!-- faixa de destaque (grupo bio-banded) -->
  <rect x="600" y="420" width="420" height="320" rx="16" fill="#d1590f" opacity="0.08"/>
  <rect x="600" y="420" width="420" height="320" rx="16" fill="none" stroke="#d1590f" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 10"/>

  <g fill="#e57426">
    <circle cx="680" cy="540" r="30"/>
    <rect x="650" y="572" width="58" height="168" rx="20"/>
  </g>
  <g fill="#e57426">
    <circle cx="820" cy="500" r="32"/>
    <rect x="787" y="534" width="62" height="206" rx="20"/>
  </g>
  <g fill="#e57426">
    <circle cx="950" cy="530" r="30"/>
    <rect x="920" y="562" width="58" height="178" rx="20"/>
  </g>

  <g fill="#7686a8" fill-opacity="0.5">
    <circle cx="1120" cy="480" r="34"/>
    <rect x="1085" y="516" width="66" height="224" rx="22"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.5">
    <circle cx="1260" cy="500" r="32"/>
    <rect x="1228" y="534" width="62" height="206" rx="20"/>
  </g>
</svg>
