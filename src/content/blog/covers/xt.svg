<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- grade de zonas do campo, com opacidade crescente em direção ao gol -->
  <g stroke="#e6eaf3" stroke-opacity="0.1" stroke-width="2">
    <rect x="200" y="180" width="1200" height="540" fill="none"/>
    <line x1="400" y1="180" x2="400" y2="720"/>
    <line x1="600" y1="180" x2="600" y2="720"/>
    <line x1="800" y1="180" x2="800" y2="720"/>
    <line x1="1000" y1="180" x2="1000" y2="720"/>
    <line x1="1200" y1="180" x2="1200" y2="720"/>
  </g>

  <g opacity="0.9">
    <rect x="200" y="180" width="200" height="540" fill="#d1590f" opacity="0.05"/>
    <rect x="400" y="180" width="200" height="540" fill="#d1590f" opacity="0.09"/>
    <rect x="600" y="180" width="200" height="540" fill="#d1590f" opacity="0.15"/>
    <rect x="800" y="180" width="200" height="540" fill="#d1590f" opacity="0.24"/>
    <rect x="1000" y="180" width="200" height="540" fill="#d1590f" opacity="0.36"/>
    <rect x="1200" y="180" width="200" height="540" fill="#d1590f" opacity="0.5"/>
  </g>

  <!-- trajeto de uma ação avançando pelas zonas -->
  <path d="M 300 560 C 500 560, 560 470, 700 440 C 900 400, 1050 320, 1300 280" fill="none" stroke="#f4f6fa" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.8"/>
  <circle cx="300" cy="560" r="10" fill="#7686a8"/>
  <circle cx="700" cy="440" r="10" fill="#e57426"/>
  <circle cx="1300" cy="280" r="14" fill="#f4f6fa"/>

  <!-- gol -->
  <rect x="1370" y="380" width="14" height="140" fill="#f4f6fa" opacity="0.7"/>
</svg>
