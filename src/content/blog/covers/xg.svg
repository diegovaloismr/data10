<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- linhas de base sutis -->
  <g stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2">
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <line x1="0" y1="520" x2="1600" y2="520"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
  </g>

  <!-- barras (histórico de xG por partida) -->
  <g>
    <rect x="360" y="560" width="70" height="80" rx="6" fill="#3d517d" fill-opacity="0.55"/>
    <rect x="460" y="500" width="70" height="140" rx="6" fill="#3d517d" fill-opacity="0.55"/>
    <rect x="560" y="440" width="70" height="200" rx="6" fill="#3d517d" fill-opacity="0.55"/>
    <rect x="660" y="480" width="70" height="160" rx="6" fill="#3d517d" fill-opacity="0.55"/>
    <rect x="760" y="360" width="70" height="280" rx="6" fill="#e57426" fill-opacity="0.92"/>
    <rect x="860" y="500" width="70" height="140" rx="6" fill="#3d517d" fill-opacity="0.55"/>
    <rect x="960" y="420" width="70" height="220" rx="6" fill="#3d517d" fill-opacity="0.55"/>
  </g>

  <!-- arco de "gol esperado" sobre a barra em destaque -->
  <path d="M 745 340 Q 795 280 845 340" fill="none" stroke="#e57426" stroke-width="4" stroke-opacity="0.7"/>
  <circle cx="795" cy="330" r="9" fill="#e57426" filter="url(#blur)" opacity="0.6"/>
  <circle cx="795" cy="330" r="7" fill="#f4f6fa"/>

  <!-- linha de campo discreta na base -->
  <line x1="0" y1="820" x2="1600" y2="820" stroke="#e6eaf3" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="1420" cy="820" r="120" fill="none" stroke="#e6eaf3" stroke-opacity="0.05" stroke-width="2"/>
</svg>
