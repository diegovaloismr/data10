<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- tesselação estilo Voronoi: polígonos irregulares dividindo o campo -->
  <g stroke="#e6eaf3" stroke-opacity="0.22" stroke-width="2" fill="none">
    <path d="M 200 180 L 480 220 L 520 420 L 300 480 Z"/>
    <path d="M 480 220 L 780 160 L 840 380 L 520 420 Z"/>
    <path d="M 780 160 L 1100 210 L 1080 400 L 840 380 Z"/>
    <path d="M 1100 210 L 1400 260 L 1360 460 L 1080 400 Z"/>
    <path d="M 200 180 L 300 480 L 220 700 L 160 420 Z"/>
    <path d="M 300 480 L 520 420 L 560 640 L 340 720 Z"/>
    <path d="M 520 420 L 840 380 L 860 620 L 560 640 Z"/>
    <path d="M 840 380 L 1080 400 L 1100 660 L 860 620 Z"/>
    <path d="M 1080 400 L 1360 460 L 1340 700 L 1100 660 Z"/>
    <path d="M 220 700 L 340 720 L 300 800 L 200 780 Z"/>
    <path d="M 340 720 L 560 640 L 620 800 L 300 800 Z"/>
    <path d="M 560 640 L 860 620 L 900 800 L 620 800 Z"/>
    <path d="M 860 620 L 1100 660 L 1140 800 L 900 800 Z"/>
    <path d="M 1100 660 L 1340 700 L 1360 800 L 1140 800 Z"/>
  </g>

  <!-- célula em destaque (domínio de um jogador específico) -->
  <path d="M 520 420 L 840 380 L 860 620 L 560 640 Z" fill="#d1590f" fill-opacity="0.28" stroke="#e57426" stroke-width="3"/>
  <circle cx="672" cy="480" r="12" fill="#e57426"/>

  <!-- outros jogadores, como pontos geradores das células -->
  <g fill="#7686a8">
    <circle cx="340" cy="330" r="9"/>
    <circle cx="940" cy="290" r="9"/>
    <circle cx="1240" cy="330" r="9"/>
    <circle cx="260" cy="580" r="9"/>
    <circle cx="720" cy="720" r="9"/>
    <circle cx="1000" cy="530" r="9"/>
    <circle cx="1220" cy="580" r="9"/>
  </g>
</svg>
