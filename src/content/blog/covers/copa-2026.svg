<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- globo estilizado -->
  <g fill="none" stroke="#7686a8" stroke-opacity="0.4" stroke-width="2">
    <circle cx="800" cy="450" r="280"/>
    <ellipse cx="800" cy="450" rx="280" ry="90"/>
    <ellipse cx="800" cy="450" rx="120" ry="280"/>
    <line x1="520" y1="450" x2="1080" y2="450"/>
  </g>
  <g fill="none" stroke="#e6eaf3" stroke-opacity="0.12" stroke-width="1.5">
    <ellipse cx="800" cy="450" rx="280" ry="180"/>
    <ellipse cx="800" cy="450" rx="200" ry="280"/>
  </g>

  <!-- pontos conectados (torneio global, três sedes) -->
  <g stroke="#e57426" stroke-opacity="0.6" stroke-width="2.5" fill="none">
    <path d="M 650 340 C 700 400, 750 420, 800 450"/>
    <path d="M 980 330 C 920 390, 860 420, 800 450"/>
    <path d="M 800 640 C 800 570, 800 510, 800 450"/>
  </g>

  <g fill="#f4f6fa">
    <circle cx="650" cy="340" r="12"/>
    <circle cx="980" cy="330" r="12"/>
    <circle cx="800" cy="640" r="12"/>
  </g>
  <circle cx="800" cy="450" r="16" fill="#e57426"/>

  <!-- órbita externa, referência a alcance global -->
  <ellipse cx="800" cy="450" rx="400" ry="400" fill="none" stroke="#e6eaf3" stroke-opacity="0.06" stroke-width="2"/>
</svg>
