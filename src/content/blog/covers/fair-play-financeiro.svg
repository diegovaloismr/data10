<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- barras de custo de elenco por clube, algumas ultrapassando o teto -->
  <g>
    <rect x="360" y="520" width="70" height="180" fill="#7686a8" fill-opacity="0.45"/>
    <rect x="460" y="460" width="70" height="240" fill="#7686a8" fill-opacity="0.45"/>
    <rect x="560" y="380" width="70" height="320" fill="#e57426"/>
    <rect x="660" y="500" width="70" height="200" fill="#7686a8" fill-opacity="0.45"/>
    <rect x="760" y="340" width="70" height="360" fill="#e57426"/>
    <rect x="860" y="440" width="70" height="260" fill="#7686a8" fill-opacity="0.45"/>
    <rect x="960" y="300" width="70" height="400" fill="#e57426"/>
    <rect x="1060" y="480" width="70" height="220" fill="#7686a8" fill-opacity="0.45"/>
  </g>

  <!-- linha de teto (70% da receita) cruzando as barras que a ultrapassam -->
  <line x1="320" y1="420" x2="1140" y2="420" stroke="#f4f6fa" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1150" y="426" fill="#f4f6fa" fill-opacity="0.6" font-family="Georgia, serif" font-size="22">teto: 70%</text>

  <!-- base/eixo -->
  <line x1="320" y1="700" x2="1140" y2="700" stroke="#e6eaf3" stroke-opacity="0.25" stroke-width="2"/>
</svg>
