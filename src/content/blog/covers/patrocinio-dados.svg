<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#d1590f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d1590f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- camisa estilizada, com espaço de patrocinador no peito -->
  <g fill="none" stroke="#e6eaf3" stroke-opacity="0.3" stroke-width="4">
    <path d="M 340 260 L 460 200 L 560 260 L 620 220 L 700 300 L 640 360 L 620 340 L 620 680 L 380 680 L 380 340 L 360 360 L 300 300 L 380 220 Z"/>
  </g>
  <rect x="430" y="360" width="140" height="60" rx="6" fill="#7686a8" fill-opacity="0.4"/>

  <!-- setas de dado saindo do espaço de patrocínio, virando gráfico -->
  <path d="M 570 390 C 700 380, 820 360, 900 300" fill="none" stroke="#e57426" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- gráfico de barras crescente representando ROI/dados -->
  <g fill="#e57426">
    <rect x="920" y="480" width="60" height="140"/>
    <rect x="1010" y="420" width="60" height="200"/>
    <rect x="1100" y="340" width="60" height="280"/>
    <rect x="1190" y="260" width="60" height="360"/>
  </g>
  <g fill="#7686a8" fill-opacity="0.5">
    <rect x="920" y="460" width="60" height="20"/>
    <rect x="1010" y="400" width="60" height="20"/>
    <rect x="1100" y="320" width="60" height="20"/>
    <rect x="1190" y="240" width="60" height="20"/>
  </g>

  <line x1="880" y1="620" x2="1300" y2="620" stroke="#e6eaf3" stroke-opacity="0.2" stroke-width="2"/>
</svg>
