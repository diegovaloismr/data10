name: Deploy Data10 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Atualiza a tabela do Brasileirão e das ligas internacionais automaticamente todo dia.
    # Horário em UTC; 11:00 UTC ≈ 08:00 no horário de Brasília (UTC-3).
    - cron: '0 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fixa main explicitamente: disparos por `schedule` (cron) fazem
          # checkout da default branch do repositório, não necessariamente
          # main — se a default branch do repo ficar desatualizada ou for
          # outra (ex: uma branch de feature antiga), o cron diário
          # republicaria conteúdo velho por cima do último deploy real.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch tabela, casa/fora, sequência e artilheiros (football-data.org)
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: node scripts/fetch-football-data.mjs

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
